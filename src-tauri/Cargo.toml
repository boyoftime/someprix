[package]
name = "someprix"
version = "1.9.4"
description = "Someprix desktop app"
authors = ["Someprix"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "someprix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
russh-sftp = "3"
notify = "8"
ignore = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tauri-plugin-clipboard-manager = "2"
trash = "5"
tar = "0.4"
flate2 = "1"
futures = "0.3"
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
